version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventflow
      POSTGRES_PASSWORD: eventflow
      POSTGRES_DB: eventflow
    ports:
      - "5432:5432"
    volumes:
      - eventflow_pgdata:/var/lib/postgresql/data

volumes:
  eventflow_pgdata:
