{% load humanize %}
{% if lines %}
  <div class="mt-4 flex items-center justify-between border-t border-line pt-4">
    <span class="text-sm text-ink/60">Sous-total</span>
    <span class="font-mono text-lg font-medium text-ink">{{ subtotal|intcomma }} FCFA</span>
  </div>
  {% if total_selected %}
    <p class="mt-1 text-xs text-ink/50">{{ total_selected }} billet{{ total_selected|pluralize }} sélectionné{{ total_selected|pluralize }}</p>
  {% endif %}
{% else %}
  <div class="mt-4 flex items-center justify-between border-t border-line pt-4">
    <span class="text-sm text-ink/60">Sous-total</span>
    <span class="font-mono text-lg font-medium text-ink">0 FCFA</span>
  </div>
{% endif %}
