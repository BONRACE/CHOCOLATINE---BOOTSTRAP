<table class="w-full text-left text-sm">
  <thead class="bg-forest/5 text-xs uppercase tracking-wide text-ink/50">
    <tr>
      <th class="px-5 py-3 font-medium">Participant</th>
      <th class="px-5 py-3 font-medium">Statut</th>
    </tr>
  </thead>
  <tbody class="divide-y divide-line">
    {% for row in rows %}
      <tr class="hover:bg-forest/5">
        <td class="px-5 py-3">
          <p class="font-medium text-ink">{{ row.name }}</p>
          <p class="text-xs text-ink/40">{{ row.ticket.order.buyer_email }}</p>
        </td>
        <td class="px-5 py-3">
          <span class="rounded-full px-2.5 py-1 text-xs font-medium
            {% if row.status == 'Payé' %}bg-forest/10 text-forest
            {% elif row.status == 'Scanné' %}bg-gold/20 text-gold-dim
            {% else %}bg-coral/10 text-coral{% endif %}">
            {{ row.status }}
          </span>
        </td>
      </tr>
    {% empty %}
      <tr><td colspan="2" class="px-5 py-8 text-center text-ink/40">Aucun participant trouvé.</td></tr>
    {% endfor %}
  </tbody>
</table>
