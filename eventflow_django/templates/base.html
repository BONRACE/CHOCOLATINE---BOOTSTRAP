{% load static %}<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EventFlow{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: "#12241C",
            forest: { DEFAULT: "#0B4A32", dark: "#082F20", light: "#14684A" },
            gold: { DEFAULT: "#D4A62F", dim: "#B4901F", pale: "#F0DFA6" },
            ivory: "#F6F2E7",
            coral: "#E2572B",
            line: "#DCD3BE",
          },
          fontFamily: {
            display: ["Fraunces", "serif"],
            body: ["Inter", "sans-serif"],
            mono: ["IBM Plex Mono", "monospace"],
          },
          borderRadius: { stub: "20px" },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body class="font-body bg-ivory text-ink antialiased">

  {% if messages %}
    <div class="mx-auto max-w-6xl px-6 pt-4">
      {% for message in messages %}
        <div class="mb-2 rounded-lg border border-line bg-white px-4 py-2.5 text-sm text-ink/80">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}

  {% block content %}{% endblock %}

  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
